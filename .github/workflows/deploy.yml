name: Deploy Site & Mod

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build mod (Gradle)
        run: ./gradlew build --no-daemon

      - name: Prepare site assets (jar + version.json)
        run: |
          set -e
          JAR=$(ls build/libs/random_island-*.jar | grep -vE '-(sources|dev)\.jar$' | head -n1)
          mkdir -p site/download
          cp "$JAR" "site/download/$(basename "$JAR")"
          SIZE=$(du -h "$JAR" | cut -f1)
          VER=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          MC=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          DATE=$(date +%F)
          cat > site/version.json <<EOF
          {
            "name": "随机空岛",
            "version": "$VER",
            "fileName": "$(basename "$JAR")",
            "size": "$SIZE",
            "updated": "$DATE",
            "mcVersion": "$MC",
            "loader": "Fabric",
            "changelog": "见 GitHub Releases / 游戏内更新说明。"
          }
          EOF
          echo "Prepared $JAR (v$VER, $SIZE)"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name random-island-site
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
