name = "random-island-site"
pages_build_output_dir = "site"
compatibility_date = "2026-10-11"

# 部署方式（任选其一）：
# 1) Git 集成（推荐）：在 Cloudflare Pages 后台用 GitHub 连接本仓库，
#    生产分支设为 main，构建命令留空，输出目录填 site。每次 push 自动部署。
# 2) Wrangler 直传：设置环境变量 CLOUDFLARE_API_TOKEN 与 CLOUDFLARE_ACCOUNT_ID 后运行
#    wrangler pages deploy site --project-name random-island-site
#
# account_id 也可直接写在这里，但更推荐用环境变量保管，避免泄露。
# account_id = "你的cloudflare账户id"
