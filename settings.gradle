pluginManagement {
    repositories {
        maven { url 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
    }
}

plugins {
    id 'fabric-loom' version '1.7.4'
}

// Loom 1.7.x 会把自己的本地仓库（remapped_mods / minecraftMaven）注册到 settings 的
// dependencyResolutionManagement。若项目层再声明 repositories，Gradle 默认的
// PREFER_PROJECT 模式会让项目仓库「覆盖」settings 仓库，导致 Loom 的本地仓库全部失效，
// 进而在解析 compileClasspath 时报：
//   Could not find net_fabricmc_yarn_...:cloth-config-fabric:...
//   Could not find net.minecraft:minecraft-merged-<hash>:...
// 因此统一在 settings 层声明仓库，并使用 PREFER_SETTINGS。
dependencyResolutionManagement {
    repositoriesMode = org.gradle.api.initialization.resolve.RepositoriesMode.PREFER_SETTINGS
    repositories {
        mavenCentral()
        maven { url 'https://maven.fabricmc.net/' }
        maven { url 'https://libraries.minecraft.net/' }
        maven { url 'https://maven.terraformersmc.com/releases/' }
        maven { url 'https://maven.shedaniel.me/' }
    }
}
